<!DOCTYPE html>

<head>

<title>KurdCraft | کوردکرافت</title>
<meta name="description" content="KurdCraft Electronics — Shiar Mohammad. Battery work & electronics, Erbil.">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    background:#0b0f14; color:#f2f7f9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; overflow-x:hidden;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  /* faint circuit glow */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(600px 400px at 85% 10%, rgba(226,162,59,.14), transparent 65%),
      radial-gradient(500px 400px at 10% 90%, rgba(20,184,166,.10), transparent 65%);
  }
  .wrap { position:relative; width:100%; max-width:400px; text-align:center; }
  .badge {
    width:104px; height:104px; margin:0 auto 18px;
    border-radius:26px; padding:3px;
    background: conic-gradient(from 140deg, #e2a23b, #8a6a24, #e2a23b, #b8862e, #e2a23b);
    animation: spinGlow 6s linear infinite;
    box-shadow: 0 10px 40px rgba(226,162,59,.35);
  }
  @keyframes spinGlow { to { filter:hue-rotate(12deg) brightness(1.15); } }
  .badge img { width:100%; height:100%; border-radius:23px; display:block; background:#10141a; }
  h1 { font-size:30px; font-weight:800; letter-spacing:.5px; color:#fff; line-height:1.15; }
  h1 small { display:block; font-size:15px; font-weight:400; color:#9aa4ad; margin-top:6px; letter-spacing:2px; }
  .role {
    margin-top:14px; display:inline-block; font-size:12.5px; letter-spacing:1px;
    color:#e2a23b; border:1px solid rgba(226,162,59,.45); border-radius:999px;
    padding:7px 16px; background:rgba(226,162,59,.08);
  }
  .shiar { margin-top:10px; font-size:14px; color:#8a97a3; }
  .shiar b { color:#d7dde2; }
  .btns { margin-top:30px; display:flex; flex-direction:column; gap:14px; }
  .btn {
    position:relative; display:flex; align-items:center; gap:14px;
    padding:16px 20px; border-radius:18px; text-decoration:none;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
    overflow:hidden;
  }
  .btn:active { transform:scale(.97); }
  .btn .ico {
    width:44px; height:44px; border-radius:13px; flex:0 0 44px;
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.14);
  }
  .btn .txt { text-align:right; flex:1; }
  .btn .txt b { display:block; font-size:17px; font-weight:700; color:#fff; }
  .btn .txt span { display:block; font-size:12px; opacity:.75; margin-top:2px; }
  .btn .arrow { font-size:20px; opacity:.6; }
  .btn.ig {
    background: linear-gradient(120deg,#7b3fa0, #c13584 45%, #e1306c 75%, #f77737);
    box-shadow: 0 10px 30px rgba(225,48,108,.35);
  }
  .btn.wa {
    background: linear-gradient(120deg,#0e6e4a, #128c5e 55%, #25d366);
    box-shadow: 0 10px 30px rgba(18,140,94,.35);
  }
  .btn:hover { filter:brightness(1.08); box-shadow:0 14px 40px rgba(0,0,0,.5); }
  /* charge bar sweep */
  .btn::after {
    content:""; position:absolute; top:0; bottom:0; width:40%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);
    transform:translateX(-260%) skewX(-18deg);
    animation: sweep 2.6s ease-in-out infinite;
  }
  .btn.wa::after { animation-delay:.5s; }
  @keyframes sweep { 0%,55% {transform:translateX(-260%) skewX(-18deg);} 100% {transform:translateX(620%) skewX(-18deg);} }
  .foot { margin-top:26px; font-size:11.5px; color:#5c6874; letter-spacing:1.5px; }
  @media (max-height:700px){ .badge{width:84px;height:84px;margin-bottom:12px} h1{font-size:25px} .btns{margin-top:22px} }
</style>
</head>
